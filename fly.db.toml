# The permanent database: Postgres + PostGIS (the same image the tests and the importer use) on
# one small machine with a volume, reached by the API over Fly's private network only
# (whh-db.internal:5432). Fly snapshots the volume daily. Set up once from the repo root:
#   fly apps create whh-db
#   fly volumes create whh_db_data --app whh-db --region iad --size 10 --vm-size shared-cpu-1x
#   fly secrets set --app whh-db POSTGRES_PASSWORD=...
#   fly deploy --config fly.db.toml
app = "whh-db"
primary_region = "iad"
# Time for Postgres to shut down cleanly before Fly kills it.
kill_timeout = 60

[build]
  image = "postgis/postgis:18-3.6"

[env]
  PGDATA = "/data/pgdata"
  POSTGRES_DB = "whh"

[processes]
  # Sized for 1 GB of RAM: a quarter for shared buffers, the rest left to the OS page cache,
  # which Postgres counts on (effective_cache_size). SSD storage, so random reads are cheap.
  app = "postgres -c shared_buffers=256MB -c effective_cache_size=640MB -c work_mem=8MB -c maintenance_work_mem=128MB -c max_connections=30 -c random_page_cost=1.1"

[mounts]
  source = "whh_db_data"
  destination = "/data"

# No services: nothing is exposed to the internet.

[[restart]]
  policy = "always"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
