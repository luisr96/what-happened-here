# Production on one VPS (8 GB RAM): Caddy (HTTPS) -> API -> Postgres + PostGIS. Only Caddy
# publishes ports; the database is reachable only on Compose's internal network. Secrets and
# the domain come from .env next to this file on the server (see .env.example), never the repo.
#   docker compose pull && docker compose up -d

services:
  db:
    image: postgis/postgis:18-3.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: whh
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    # Sized so the whole database (~2.8 GB) stays in memory: shared buffers plus the OS page
    # cache that effective_cache_size tells the planner about. autoprewarm reloads the buffers
    # after a restart, so the first requests don't wait on the disk.
    command: >
      postgres
      -c shared_buffers=2GB
      -c effective_cache_size=5GB
      -c work_mem=16MB
      -c maintenance_work_mem=512MB
      -c max_connections=30
      -c random_page_cost=1.1
      -c shared_preload_libraries=pg_prewarm
      -c pg_prewarm.autoprewarm=true
    # Parallel queries share memory through /dev/shm; Docker's default 64 MB is too small.
    shm_size: 512mb
    volumes:
      # Postgres 18 images keep their data under /var/lib/postgresql/18/docker.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "whh"]
      interval: 10s
      timeout: 5s
      retries: 10
    stop_grace_period: 60s

  api:
    image: ghcr.io/luisr96/what-happened-here-api:${API_TAG:-latest}
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/whh
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      APP_CORS_ALLOWED_ORIGINS: https://luisr96.github.io
      # Trust Caddy's X-Forwarded-* headers so generated URLs (the OpenAPI "servers" entry that
      # Swagger UI's "Try it out" calls) use https and the public host, not http://api:8080.
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      # The Wikidata dump the database was imported from, shown in the About dialog.
      APP_DATA_DUMP_DATE: "2026-10-12"
    # The image sizes its heap at 75% of this limit.
    mem_limit: 1g
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2.10
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

volumes:
  db-data:
  caddy-data:
  caddy-config:
