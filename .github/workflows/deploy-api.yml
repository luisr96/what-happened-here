# Tests the API (Testcontainers needs the runner's Docker), publishes its image to GitHub's
# container registry and restarts it on the VPS (deploy/compose.yaml) over SSH.
name: Deploy API

on:
  push:
    branches: [main]
    # Everything api/Dockerfile copies, plus this file.
    paths:
      - "api/**"
      - "extractor/**"
      - "sampler/build.gradle.kts"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradlew"
      - "importer/build.gradle.kts"
      - "deploy/compose.yaml"
      - "deploy/Caddyfile"
      - ".dockerignore"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :extractor:test :api:test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/luisr96/what-happened-here-api
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }},${{ env.IMAGE }}:latest
      # The server's host key is pinned (DEPLOY_KNOWN_HOSTS), so a swapped server is refused;
      # BatchMode makes a key or host-key problem fail at once instead of waiting for a prompt.
      # The server must already have /opt/whh/.env with an API_TAG line (deploy/README.md).
      - name: Restart the API on the server
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ vars.DEPLOY_HOST }}
          TAG: ${{ github.sha }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          opts="-i $HOME/.ssh/deploy -o BatchMode=yes -o StrictHostKeyChecking=yes"
          scp $opts deploy/compose.yaml deploy/Caddyfile "deploy@$HOST:/opt/whh/"
          ssh $opts "deploy@$HOST" "cd /opt/whh && grep -q '^API_TAG=' .env && sed -i 's/^API_TAG=.*/API_TAG=$TAG/' .env && docker compose pull api && docker compose up -d"
