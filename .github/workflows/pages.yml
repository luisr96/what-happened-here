# Tests and builds the frontend and publishes it to GitHub Pages
# (https://luisr96.github.io/what-happened-here/).
name: Deploy frontend

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check the API URL
        # Same rule as apiBaseUrl() in src/api/client.ts, checked here so a bad value fails the
        # build instead of shipping a site whose every request fails. Passed via env, not
        # interpolated into the script.
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          [[ "$API_BASE_URL" =~ ^https://[^/] ]]             || { echo "::error::Set the API_BASE_URL repository variable to the API's https URL"; exit 1; }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:api
      - run: npm test
      - run: npm run build
        env:
          # A project site is served under /<repo>/.
          BASE_PATH: /what-happened-here/
          # The API's public URL, a repository variable (Settings > Secrets and variables > Actions).
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
