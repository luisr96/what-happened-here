# The API on Fly.io. Deployed by .github/workflows/deploy-api.yml (or `fly deploy` from the repo
# root). Database credentials are Fly secrets, set once with `fly secrets set`:
#   SPRING_DATASOURCE_URL=jdbc:postgresql://<neon-host>/<db>?sslmode=require
#   SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD
# Flyway runs at startup, so a deploy applies any new migration to the hosted database (gated
# only by the CI tests); a migration that fails stops the app from starting.
app = "what-happened-here-api"
primary_region = "iad"

[build]
  dockerfile = "api/Dockerfile"

[env]
  # The GitHub Pages site calls the API from this origin (see CorsConfig).
  APP_CORS_ALLOWED_ORIGINS = "https://luisr96.github.io"

[http_service]
  internal_port = 8080
  force_https = true
  # Always on: no cold start on the first visit.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    # Spring Boot's health endpoint, which includes the database connection.
    path = "/actuator/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
